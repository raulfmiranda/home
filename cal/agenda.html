<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <script src="auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda CrMS</title>
  <link rel="stylesheet" href="agenda.css" />
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="topbar">
        <h1>Agenda CrMS</h1>

        <nav class="menu" aria-label="Menu principal">
          <a class="menu-link" href="agenda.html" aria-current="page">📅 Agenda</a>

          <div class="menu-dropdown">
            <button id="menu-whatsapp-toggle" class="menu-toggle" type="button"
                    aria-haspopup="true" aria-expanded="false">
              💬 Mensagens WhatsApp ▾
            </button>
            <div id="menu-whatsapp-list" class="menu-list hidden">
              <button id="welcome-whatsapp-btn" class="menu-item" type="button">
                📋 Copiar texto de Boas-Vindas WhatsApp
              </button>
              <button id="suggest-slots-btn" class="menu-item" type="button">
                🗓️ Copiar Sugestão de Horários WhatsApp
              </button>
            </div>
          </div>
        </nav>
      </div>

      <div id="status" class="status">Carregando eventos...</div>
    </header>

    <main id="calendars-container" class="calendars-container"></main>

    <div id="event-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Fechar">&times;</button>
        <h2 id="modal-title"></h2>
        <p id="modal-date" class="modal-date"></p>
        <p id="modal-location" class="modal-detail"></p>
        <p id="modal-description" class="modal-detail"></p>

        <div id="modal-reminder-section" class="modal-reminder-section hidden">
          <label class="modal-checkbox-label">
            <input type="checkbox" id="modal-is-new-client" />
            Cliente Nova (Início em 2026)?
            <span class="price-hint">Marcado: R$ 230,00 | Desmarcado: R$ 220,00</span>
          </label>
          <button id="modal-copy-reminder-btn" class="copy-btn" type="button">
            📋 Copiar Lembrete para WhatsApp
          </button>
        </div>
        <span id="modal-copy-feedback" class="copy-feedback hidden">Copiado!</span>
      </div>
    </div>

    <script src="https://unpkg.com/ical.js@2.2.0/dist/ical.es5.min.cjs"></script>
    <script src="agenda.js"></script>
  </div>
</body>
</html>
